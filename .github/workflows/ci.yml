name: CI
# The scaffold test runs only when what it exercises changes: setup.sh, its
# templates, the test and this workflow. It is one ~40 s job, so the push
# that merges a pull request runs it again rather than paying for the scope
# and receipt jobs that would let it skip. Push runs are never cancelled:
# GitHub filters a push by its own before..after range, so a cancelled run
# would drop its changes from the check.
on:
  push:
    branches: [master]
    paths:
      - setup.sh
      - templates/**
      - tests/**
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - setup.sh
      - templates/**
      - tests/**
      - .github/workflows/ci.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scaffold:
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: read
      id-token: write
    runs-on: arc-llm-init
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@28c5ce3a0cd3f6198194b834c558ac50b446b30a # v1.7.0
        with:
          go-version: stable
      - name: Shell syntax
        run: bash -n setup.sh tests/go-scaffold.sh
      - name: Generate and test a Go project
        run: bash tests/go-scaffold.sh
